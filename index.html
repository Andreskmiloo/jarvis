<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05070d">
  <title>Jarvis</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2338bdf8'/%3E%3Cstop offset='1' stop-color='%23818cf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='10' fill='%2305070d'/%3E%3Ccircle cx='20' cy='20' r='13' fill='none' stroke='url(%23g)' stroke-width='3' stroke-dasharray='62 20'/%3E%3Ccircle cx='20' cy='20' r='4.5' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Degradados compartidos por los gráficos (anillos, logo) -->
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="gradMarca" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
      <linearGradient id="gradAnillo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
      <linearGradient id="gradAtraso" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    </defs>
  </svg>

  <!-- Fondo con movimiento suave -->
  <div class="fondo" aria-hidden="true"><i class="orbe a"></i><i class="orbe b"></i><i class="orbe c"></i></div>

  <div class="app">
    <aside class="lateral">
      <header class="marca">
        <a class="marca-logo" href="#inicio" aria-label="Jarvis, ir al inicio">
          <svg class="logo" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <circle cx="20" cy="20" r="17" fill="none" stroke="url(#gradMarca)" stroke-width="1.5" opacity=".35"/>
            <circle class="logo-arco" cx="20" cy="20" r="17" fill="none" stroke="url(#gradMarca)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="30 77"/>
            <circle cx="20" cy="20" r="10" fill="none" stroke="url(#gradMarca)" stroke-width="1.5" opacity=".6"/>
            <circle class="logo-nucleo" cx="20" cy="20" r="4.5" fill="url(#gradMarca)"/>
          </svg>
          <span class="marca-texto"><b>Jarvis</b><small>Control personal</small></span>
        </a>
        <div class="reloj-chip" title="Tus datos se guardan en este navegador"><span class="punto"></span><span id="reloj"></span></div>
        <button type="button" class="btn primario registrar-lat" id="registrar-lat" data-accion="registrar"></button>
      </header>
      <nav id="menu" class="menu" aria-label="Secciones"></nav>
      <div class="pie-lateral">
        <div class="pie-estado"><span class="punto"></span><span>Guardado en este navegador</span></div>
        <button type="button" class="btn suave mini" id="pie-exportar" data-accion="exportar"></button>
        <span class="pie-respaldo" id="pie-respaldo"></span>
      </div>
    </aside>

    <main id="vista"></main>
  </div>

  <button type="button" class="fab" id="fab" data-accion="registrar" aria-label="Registrar movimiento" title="Registrar movimiento"></button>
  <div id="hoja" class="hoja" aria-hidden="true"></div>
  <div id="avisos" class="avisos" aria-live="polite"></div>
  <noscript><p class="aviso">Jarvis necesita JavaScript para funcionar.</p></noscript>

  <!-- Scripts normales (no módulos): así funciona abriendo este archivo con doble clic -->
  <script src="js/iconos.js"></script>
  <script src="js/util.js"></script>
  <script src="js/semilla.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cuentas.js"></script>
  <script src="js/finanzas.js"></script>
  <script src="js/pendientes.js"></script>
  <script src="js/negocio.js"></script>
  <script src="js/analisis.js"></script>
  <script src="js/tablero.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

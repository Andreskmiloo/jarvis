name: Publicar Ojo de Dios

on:
  push:
    branches: [main, claude/bogota-heat-map-5w1g6k]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Opcional: clave gratuita de la Webcams API de Windy (Settings → Secrets → Actions).
          VITE_WINDY_KEY: ${{ secrets.VITE_WINDY_KEY }}
          # URL del puente de aviones (Settings → Secrets and variables → Actions → Variables).
          VITE_AVIONES_URL: ${{ vars.VITE_AVIONES_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Publicar Ojo de Dios

on:
  schedule:
    - cron: "17 9 * * 1" # cada lunes refresca los lugares
  push:
    branches: [main, claude/bogota-heat-map-5w1g6k]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Incendios (NASA FIRMS 24 h) y órbitas de satélites (CelesTrak) frescos en cada publicación.
      - name: Actualizar incendios y satélites
        run: node scripts/guardar-espacio.mjs
        continue-on-error: true
        timeout-minutes: 8
      # Refresca los lugares guardados con Overpass (desde GitHub sí responde). Si falla, quedan los del repo.
      - name: Actualizar lugares guardados
        run: node scripts/guardar-lugares.mjs
        continue-on-error: true
        timeout-minutes: 20
      - run: npm run build
        env:
          # Opcional: clave gratuita de la Webcams API de Windy (Settings → Secrets → Actions).
          VITE_WINDY_KEY: ${{ secrets.VITE_WINDY_KEY }}
          # URL del puente de aviones (Settings → Secrets and variables → Actions → Variables).
          VITE_AVIONES_URL: ${{ vars.VITE_AVIONES_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
